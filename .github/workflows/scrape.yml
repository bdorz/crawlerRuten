name: 一抽露魂巡測

on:
  schedule:
    # 每 4 小時執行一次（UTC）
    - cron: "0 */4 * * *"
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write   # 允許 commit result.html 回 repo
  pages: write      # 允許部署 GitHub Pages
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.html winners.json
          git diff --staged --quiet || git commit -m "chore: update scrape results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Send notification email
        if: ${{ hashFiles('notification.txt') != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: "🎯 一抽露魂：新增大賞機率超過開套機率商品"
          to: aegis22297@gmail.com
          from: 一抽露魂巡測 <${{ secrets.GMAIL_USER }}>
          body: file://notification.txt

      - name: Prepare Pages
        run: cp result.html index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
